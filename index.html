<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>学習・クラス共有ポータル</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter & Google School/Chalkboard feel -->
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Yuji+Mai&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        chalkboard: {
                            DEFAULT: '#1e382b',
                            dark: '#14271d',
                            border: '#3d5c4b',
                        },
                        wood: '#8b5a2b'
                    },
                    fontFamily: {
                        chalk: ['"Kiwi Maru"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* カスタムスクロールバー & テキスト切替え */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }
        .chalk-text {
            color: #f0f4f1;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.2), 0 0 5px rgba(240, 244, 241, 0.3);
        }
        .chalk-yellow {
            color: #fff3a1;
            text-shadow: 1px 1px 2px rgba(255, 243, 161, 0.3);
        }
        .chalk-pink {
            color: #ffc2d1;
            text-shadow: 1px 1px 2px rgba(255, 194, 209, 0.3);
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col pb-20 md:pb-6 transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-30 shadow-sm px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div>
                <h1 class="text-base font-bold leading-tight">学習ポータル & 黒板</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400" id="user-display-name">ユーザー接続中...</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:inline"></i>
            </button>
            <button id="settings-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-5 space-y-6">

        <!-- 設定パネル Modal/Collapse -->
        <div id="settings-modal" class="hidden bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-md transition-all">
            <h2 class="text-md font-bold mb-3 flex items-center gap-2"><i class="fa-solid fa-sliders text-blue-500"></i> ユーザー＆カレンダー設定</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold mb-1">表示名 (チャット・掲示板用)</label>
                    <input type="text" id="input-username" class="w-full text-sm p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Google カレンダー ID (メールアドレス)</label>
                    <input type="email" id="input-calendar-id" class="w-full text-sm p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700" placeholder="rf24059q@st.omu.ac.jp">
                </div>
            </div>
            <button id="save-settings-btn" class="mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg text-sm transition">
                <i class="fa-solid fa-save mr-1"></i> 設定を保存
            </button>
        </div>

        <!-- タブコンテンツ 1: ホーム & デジタル黒板 -->
        <section id="tab-home" class="tab-content space-y-5">

            <!-- 1. クイックショートカット -->
            <div class="grid grid-cols-4 gap-2 sm:gap-4">
                <a href="https://classroom.google.com" target="_blank" class="flex flex-col items-center p-3 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-md transition">
                    <i class="fa-solid fa-chalkboard-user text-green-500 text-2xl sm:text-3xl mb-1"></i>
                    <span class="text-xs font-bold text-center">Classroom</span>
                </a>
                <a href="https://calendar.google.com" target="_blank" class="flex flex-col items-center p-3 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-md transition">
                    <i class="fa-solid fa-calendar-days text-blue-500 text-2xl sm:text-3xl mb-1"></i>
                    <span class="text-xs font-bold text-center">カレンダー</span>
                </a>
                <a href="https://teams.microsoft.com" target="_blank" class="flex flex-col items-center p-3 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-md transition">
                    <i class="fa-solid fa-users text-indigo-500 text-2xl sm:text-3xl mb-1"></i>
                    <span class="text-xs font-bold text-center">Teams</span>
                </a>
                <a href="https://moodle.org" target="_blank" class="flex flex-col items-center p-3 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-md transition">
                    <i class="fa-solid fa-graduation-cap text-orange-500 text-2xl sm:text-3xl mb-1"></i>
                    <span class="text-xs font-bold text-center">Moodle</span>
                </a>
            </div>

            <!-- 2. クラスデジタル黒板 (Class Bulletin Blackboard) -->
            <div class="bg-chalkboard dark:bg-chalkboard-dark rounded-xl border-4 border-amber-900 shadow-xl p-4 sm:p-5 relative font-chalk overflow-hidden">
                <!-- 黒板ヘッダー -->
                <div class="flex justify-between items-center border-b border-emerald-700 pb-2 mb-3">
                    <h2 class="text-lg sm:text-xl font-bold chalk-text flex items-center gap-2">
                        <i class="fa-solid fa-chalkboard text-yellow-300"></i> みんなの連絡黒板
                    </h2>
                    <button id="open-board-post-modal" class="bg-amber-800 hover:bg-amber-700 text-yellow-100 text-xs px-3 py-1.5 rounded-md border border-amber-600 transition shadow">
                        <i class="fa-solid fa-pen-chalk mr-1"></i> 連絡を書き込む
                    </button>
                </div>

                <!-- 投稿一覧（黒板チョーク表示） -->
                <div id="board-posts-container" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                    <div class="text-center chalk-text py-6 text-sm">連絡事項を取得中...</div>
                </div>
            </div>

            <!-- 3. Gemini プロンプト自動生成・起動 -->
            <div class="bg-white dark:bg-gray-800 rounded-xl p-4 border border-gray-200 dark:border-gray-700 shadow-sm space-y-3">
                <h3 class="font-bold text-sm text-blue-600 dark:text-blue-400 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i> Gemini 課題プロトタイプ生成
                </h3>
                <p class="text-xs text-gray-500 dark:text-gray-400">黒板やカレンダーの課題名を入れると構成案作成プロンプトがクリップボードにコピーされGeminiが開きます。</p>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="gemini-task-title" placeholder="課題名を入力 (例: 情報演習レポート第3回)" class="flex-1 text-sm p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700">
                    <button id="gemini-launch-btn" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-90 text-white font-bold text-xs py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 shadow">
                        <i class="fa-solid fa-copy"></i> 構成案プロンプトコピー & Gemini 起動
                    </button>
                </div>
            </div>
        </section>

        <!-- タブコンテンツ 2: カレンダー -->
        <section id="tab-calendar" class="tab-content hidden space-y-4">
            <div class="bg-white dark:bg-gray-800 rounded-xl p-4 border border-gray-200 dark:border-gray-700 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-base flex items-center gap-2">
                        <i class="fa-solid fa-calendar-check text-blue-500"></i> 統合Googleカレンダー
                    </h2>
                    <span id="cal-status" class="text-xs text-gray-500"></span>
                </div>
                <div class="w-full h-[450px] sm:h-[550px] rounded-lg overflow-hidden border border-gray-200 dark:border-gray-700">
                    <iframe id="calendar-iframe" class="w-full h-full" src="about:blank"></iframe>
                </div>
            </div>
        </section>

        <!-- タブコンテンツ 3: クラスグループチャット -->
        <section id="tab-chat" class="tab-content hidden">
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm flex flex-col h-[75vh]">
                <!-- チャットヘッダー -->
                <div class="p-3 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-750 flex items-center justify-between">
                    <span class="font-bold text-sm flex items-center gap-2">
                        <i class="fa-solid fa-comments text-green-500"></i> クラスリアルタイムチャット
                    </span>
                    <span class="text-xs text-gray-400">全員に公開されます</span>
                </div>
                <!-- メッセージエリア -->
                <div id="chat-messages-list" class="flex-1 p-3 overflow-y-auto space-y-3 bg-gray-50/50 dark:bg-gray-900/50">
                    <div class="text-center text-xs text-gray-400 py-4">読み込み中...</div>
                </div>
                <!-- 送信フォーム -->
                <form id="chat-form" class="p-2 sm:p-3 border-t border-gray-200 dark:border-gray-700 flex gap-2">
                    <input type="text" id="chat-input-text" placeholder="メッセージを入力..." required class="flex-1 text-sm p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2.5 rounded-lg text-sm flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </section>

    </main>

    <!-- 黒板投稿用 モーダル -->
    <div id="board-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl max-w-md w-full p-4 space-y-4 shadow-xl border border-gray-200 dark:border-gray-700">
            <h3 class="font-bold text-base flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-amber-600"></i> 黒板に新しく書き込む
            </h3>
            <div>
                <label class="block text-xs font-semibold mb-1">分類</label>
                <select id="post-category" class="w-full text-sm p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700">
                    <option value="小テスト">📝 小テスト日程</option>
                    <option value="プリント課題">📄 プリント・課題締切</option>
                    <option value="連絡">連絡事項・その他</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1">タイトル・科目名</label>
                <input type="text" id="post-title" placeholder="例: 物理学演習第2回小テスト" class="w-full text-sm p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700" required>
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1">日時・締切</label>
                <input type="text" id="post-date" placeholder="例: 11/5(水) 授業開始時" class="w-full text-sm p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700" required>
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1">詳細メモ</label>
                <textarea id="post-detail" rows="2" placeholder="持ち物や範囲など..." class="w-full text-sm p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700"></textarea>
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" id="close-board-modal" class="px-3 py-1.5 text-xs text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">キャンセル</button>
                <button type="button" id="submit-board-post" class="px-4 py-1.5 text-xs bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-lg">黒板に書く</button>
            </div>
        </div>
    </div>

    <!-- スマホ用 Bottom Navigation Bar (Fixed) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 z-40 flex justify-around py-2">
        <button data-tab="tab-home" class="nav-btn active flex flex-col items-center text-blue-600 dark:text-blue-400">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-bold mt-0.5">ホーム/黒板</span>
        </button>
        <button data-tab="tab-calendar" class="nav-btn flex flex-col items-center text-gray-500 dark:text-gray-400">
            <i class="fa-solid fa-calendar-days text-lg"></i>
            <span class="text-[10px] font-bold mt-0.5">カレンダー</span>
        </button>
        <button data-tab="tab-chat" class="nav-btn flex flex-col items-center text-gray-500 dark:text-gray-400">
            <i class="fa-solid fa-comments text-lg"></i>
            <span class="text-[10px] font-bold mt-0.5">チャット</span>
        </button>
    </nav>

    <!-- Firebase Global Script (Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (環境変数または代替デフォルト)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'portal-app-default';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDummyKeyForInitializationOnly",
            authDomain: "portal-app.firebaseapp.com",
            projectId: "portal-app",
            storageBucket: "portal-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let username = localStorage.getItem('portal_username') || `名無し ${Math.floor(Math.random() * 900 + 100)}`;
        let calendarId = localStorage.getItem('portal_cal_id') || 'rf24059q@st.omu.ac.jp';

        // 初期設定UI更新
        document.getElementById('input-username').value = username;
        document.getElementById('input-calendar-id').value = calendarId;
        document.getElementById('user-display-name').innerText = `ユーザー: ${username}`;

        // カレンダー更新
        function updateCalendar(email) {
            const iframe = document.getElementById('calendar-iframe');
            const status = document.getElementById('cal-status');
            if (email) {
                iframe.src = `https://calendar.google.com/calendar/embed?src=${encodeURIComponent(email)}&ctz=Asia%2FTokyo`;
                status.innerText = email;
            }
        }
        updateCalendar(calendarId);

        // 認証初期化
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.warn("Auth initialization fallback:", err);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                setupFirestoreListeners();
            }
        });

        initAuth();

        // ----------------------------------------------------
        // Firestore リアルタイムリスナー
        // ----------------------------------------------------
        function setupFirestoreListeners() {
            if (!currentUser) return;

            // 1. 黒板データ取得
            const boardRef = collection(db, 'artifacts', appId, 'public', 'data', 'blackboard');
            onSnapshot(boardRef, (snapshot) => {
                const posts = [];
                snapshot.forEach(doc => posts.push({ id: doc.id, ...doc.data() }));
                // JS側で日付ソート (RULE 2 準拠)
                posts.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                renderBoardPosts(posts);
            }, (err) => console.error("Board snapshot error:", err));

            // 2. チャットデータ取得
            const chatRef = collection(db, 'artifacts', appId, 'public', 'data', 'chat');
            onSnapshot(chatRef, (snapshot) => {
                const messages = [];
                snapshot.forEach(doc => messages.push({ id: doc.id, ...doc.data() }));
                messages.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
                renderChatMessages(messages);
            }, (err) => console.error("Chat snapshot error:", err));
        }

        // ----------------------------------------------------
        // UI Render 処理
        // ----------------------------------------------------
        function renderBoardPosts(posts) {
            const container = document.getElementById('board-posts-container');
            if (posts.length === 0) {
                container.innerHTML = `<div class="text-center chalk-text py-4 text-xs">現在黒板への書き込みはありません。</div>`;
                return;
            }

            container.innerHTML = posts.map(post => {
                let badgeColor = 'chalk-yellow';
                if (post.category === '小テスト') badgeColor = 'chalk-pink';

                return `
                <div class="border-b border-emerald-800/60 pb-2 mb-2">
                    <div class="flex items-center justify-between text-xs mb-1">
                        <span class="${badgeColor} font-bold">[${post.category || '連絡'}]</span>
                        <span class="chalk-text text-[10px] opacity-80">${post.author || '匿名'} (${post.date || ''})</span>
                    </div>
                    <div class="text-sm font-bold chalk-text">${post.title || ''}</div>
                    ${post.detail ? `<div class="text-xs chalk-text opacity-90 pl-2 mt-0.5 border-l-2 border-yellow-200/40">${post.detail}</div>` : ''}
                </div>
                `;
            }).join('');
        }

        function renderChatMessages(messages) {
            const list = document.getElementById('chat-messages-list');
            if (messages.length === 0) {
                list.innerHTML = `<div class="text-center text-xs text-gray-400 py-4">メッセージはまだありません。会話を始めましょう！</div>`;
                return;
            }

            list.innerHTML = messages.map(msg => {
                const isMe = msg.userId === currentUser?.uid;
                return `
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                    <span class="text-[10px] text-gray-400 mb-0.5 px-1">${msg.author || '匿名'}</span>
                    <div class="max-w-[80%] rounded-xl px-3 py-2 text-sm ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 border border-gray-200 dark:border-gray-600 rounded-bl-none'} shadow-sm">
                        ${msg.text}
                    </div>
                </div>
                `;
            }).join('');
            list.scrollTop = list.scrollHeight;
        }

        // ----------------------------------------------------
        // イベントハンドラ
        // ----------------------------------------------------
        // チャット送信
        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            const input = document.getElementById('chat-input-text');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            try {
                const chatRef = collection(db, 'artifacts', appId, 'public', 'data', 'chat');
                await addDoc(chatRef, {
                    text: text,
                    author: username,
                    userId: currentUser.uid,
                    createdAt: serverTimestamp()
                });
            } catch (err) {
                console.error("Chat send error:", err);
            }
        });

        // 黒板投稿
        document.getElementById('submit-board-post').addEventListener('click', async () => {
            if (!currentUser) return;
            const title = document.getElementById('post-title').value.trim();
            const date = document.getElementById('post-date').value.trim();
            const category = document.getElementById('post-category').value;
            const detail = document.getElementById('post-detail').value.trim();

            if (!title || !date) {
                alert('タイトルと日時を入力してください。');
                return;
            }

            try {
                const boardRef = collection(db, 'artifacts', appId, 'public', 'data', 'blackboard');
                await addDoc(boardRef, {
                    title,
                    date,
                    category,
                    detail,
                    author: username,
                    userId: currentUser.uid,
                    createdAt: serverTimestamp()
                });
                document.getElementById('board-modal').classList.add('hidden');
                document.getElementById('post-title').value = '';
                document.getElementById('post-date').value = '';
                document.getElementById('post-detail').value = '';
            } catch (err) {
                console.error("Board post error:", err);
            }
        });

        // 設定保存
        document.getElementById('save-settings-btn').addEventListener('click', () => {
            username = document.getElementById('input-username').value.trim() || '名無し';
            calendarId = document.getElementById('input-calendar-id').value.trim();

            localStorage.setItem('portal_username', username);
            localStorage.setItem('portal_cal_id', calendarId);

            document.getElementById('user-display-name').innerText = `ユーザー: ${username}`;
            updateCalendar(calendarId);
            document.getElementById('settings-modal').classList.add('hidden');
            alert('設定を保存しました');
        });

        // ----------------------------------------------------
        // UI インタラクション (Tab & Modals)
        // ----------------------------------------------------
        // タブ切り替え
        const navBtns = document.querySelectorAll('.nav-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetTab = btn.getAttribute('data-tab');
                navBtns.forEach(b => {
                    b.classList.remove('text-blue-600', 'dark:text-blue-400');
                    b.classList.add('text-gray-500', 'dark:text-gray-400');
                });
                btn.classList.add('text-blue-600', 'dark:text-blue-400');
                btn.classList.remove('text-gray-500', 'dark:text-gray-400');

                tabContents.forEach(tc => tc.classList.add('hidden'));
                document.getElementById(targetTab).classList.remove('hidden');
            });
        });

        // 黒板モーダル開閉
        document.getElementById('open-board-post-modal').addEventListener('click', () => {
            document.getElementById('board-modal').classList.remove('hidden');
        });
        document.getElementById('close-board-modal').addEventListener('click', () => {
            document.getElementById('board-modal').classList.add('hidden');
        });

        // 設定トグル
        document.getElementById('settings-toggle').addEventListener('click', () => {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
        });

        // ダークモードトグル
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Gemini プロンプト自動生成＆起動
        document.getElementById('gemini-launch-btn').addEventListener('click', async () => {
            const taskInput = document.getElementById('gemini-task-title').value.trim();
            if (!taskInput) {
                alert('課題名を入力してください！');
                return;
            }

            const prompt = `あなたは大学の提出物・課題作成をサポートするプロのTA（ティーチングアシスタント）です。
提出期限が近い以下の課題について、構成案・概要・ドラフト骨子を作成してください。

【対象課題・テーマ】
${taskInput}

【希望する出力フォーマット】
1. 概要・ゴールの設定
2. 全体構成案（序論・本論・結論）
3. 執筆/作成の具体的なステップ
4. 注意点・評価ポイント`;

            try {
                document.execCommand('copy');
                await navigator.clipboard.writeText(prompt);
                alert('プロンプトをコピーしました！Geminiが開きますので Ctrl+V (Cmd+V) で貼り付けて送信してください。');
            } catch(e) {
                console.log('Clipboard fallback');
            }
            window.open('https://gemini.google.com/app', '_blank');
        });
    </script>
</body>
</html>
