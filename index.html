<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習・作業ポータル & AI アシスタント</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #e1e5eb;
            --primary-color: #4a6cf7;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            box-shadow: var(--shadow);
        }

        .btn-icon:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* リンクカード領域 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.2rem;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .card.classroom .card-icon { color: #0f9d58; }
        .card.calendar-card .card-icon { color: #4285f4; }
        .card.teams .card-icon { color: #6264a7; }
        .card.moodle .card-icon { color: #f7931e; }

        /* AI セクション */
        .ai-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .ai-layout {
                grid-template-columns: 1fr;
            }
        }

        .ai-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            height: 480px;
        }

        .ai-card h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* チャットエリア */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            background: var(--bg-color);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary-color);
            color: white;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .chat-input-box {
            display: flex;
            gap: 8px;
        }

        .chat-input-box input {
            flex: 1;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .btn-action {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        /* プロトタイプ作成エリア */
        .prototype-output {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 1rem;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-graduation-cap"></i> Portal & AI Workspace</h1>
        <div class="header-controls">
            <button class="btn-icon" id="toggle-theme"><i class="fa-solid fa-moon"></i></button>
        </div>
    </header>

    <div class="container">
        <!-- リンクエリア -->
        <div class="grid">
            <a href="https://classroom.google.com" target="_blank" class="card classroom">
                <i class="fa-solid fa-chalkboard-user card-icon"></i>
                <div class="card-title">Classroom</div>
            </a>
            <a href="https://calendar.google.com" target="_blank" class="card calendar-card">
                <i class="fa-solid fa-calendar-days card-icon"></i>
                <div class="card-title">カレンダー</div>
            </a>
            <a href="https://teams.microsoft.com" target="_blank" class="card teams">
                <i class="fa-solid fa-users card-icon"></i>
                <div class="card-title">Teams</div>
            </a>
            <a href="https://moodle.org" target="_blank" class="card moodle">
                <i class="fa-solid fa-graduation-cap card-icon"></i>
                <div class="card-title">Moodle</div>
            </a>
        </div>

        <!-- AI アシスタント エリア -->
        <div class="ai-layout">
            <!-- 1. AI質問チャット -->
            <div class="ai-card">
                <h2><i class="fa-solid fa-robot" style="color: var(--primary-color);"></i> 学習相談 AI チャット</h2>
                <div class="chat-messages" id="chat-messages">
                    <div class="message ai">こんにちは！課題の質問や勉強の相談など、何でも聞いてくださいね。</div>
                </div>
                <div class="chat-input-box">
                    <input type="text" id="chat-input" placeholder="質問を入力... (例: レポートの構成のコツは？)">
                    <button class="btn-action" id="send-chat-btn"><i class="fa-solid fa-paper-plane"></i> 送信</button>
                </div>
            </div>

            <!-- 2. 課題プロトタイプ生成器 -->
            <div class="ai-card">
                <h2><i class="fa-solid fa-wand-magic-sparkles" style="color: #f7931e;"></i> 課題プロトタイプ生成</h2>
                <div class="prototype-output" id="prototype-output">
                    下の入力欄に課題のタイトルや概要を入力してボタンを押すと、AIが構成案（プロトタイプ）を作成します。
                </div>
                <div class="chat-input-box" style="flex-direction: column; gap: 8px;">
                    <input type="text" id="task-input" placeholder="課題名・テーマを入力 (例: 物理学演習第3回レポート)">
                    <button class="btn-action" id="gen-prototype-btn" style="width: 100%; justify-content: center;">
                        <i class="fa-solid fa-bolt"></i> プロトタイプ（骨子）を即座に自動生成
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        //
        // ==========================================
        const GEMINI_API_KEY = 'ここに_GEMINI_API_KEY_を貼り付け';

        // テーマ切替
        const themeBtn = document.getElementById('toggle-theme');
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            themeBtn.innerHTML = newTheme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        });

        // Gemini API 呼び出し関数
        async function askGemini(prompt) {
            if (!GEMINI_API_KEY || GEMINI_API_KEY === 'ここに_GEMINI_API_KEY_を貼り付け') {
                return 'エラー: コード内の GEMINI_API_KEY が設定されていません。自分のAPIキーに書き換えてください。';
            }

            // 最新モデルのAPIエンドポイント
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (data.error) {
                    return `APIエラー: ${data.error.message}`;
                }

                return data.candidates[0].content.parts[0].text;
            } catch (err) {
                console.error(err);
                return '通信エラーが発生しました。ネットワークまたはAPIキーを確認してください。';
            }
        }

        // 1. AIチャット機能
        const chatInput = document.getElementById('chat-input');
        const sendChatBtn = document.getElementById('send-chat-btn');
        const chatMessages = document.getElementById('chat-messages');

        async function handleChat() {
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            chatInput.value = '';

            const loadingMsg = appendMessage('思考中...', 'ai');
            const reply = await askGemini(`大学の学習アシスタントとして以下の質問に分かりやすく答えてください:\n${text}`);
            loadingMsg.innerText = reply;
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgDiv;
        }

        sendChatBtn.addEventListener('click', handleChat);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChat(); });

        // 2. プロトタイプ自動生成機能
        const taskInput = document.getElementById('task-input');
        const genPrototypeBtn = document.getElementById('gen-prototype-btn');
        const prototypeOutput = document.getElementById('prototype-output');

        genPrototypeBtn.addEventListener('click', async () => {
            const taskName = taskInput.value.trim();
            if (!taskName) {
                alert('課題名またはテーマを入力してください！');
                return;
            }

            prototypeOutput.innerText = 'AIが課題の骨子・構成案（プロトタイプ）を作成中...';

            const prompt = `
あなたは大学の提出物・課題作成をサポートするプロのTA（ティーチングアシスタント）です。
以下の課題・テーマについて、学生が迷わず着手できるように「構成案・アプローチ・ドラフトの骨子（プロトタイプ）」を作成してください。

■ 課題テーマ/タイトル:
${taskName}

■ 出力フォーマット:
1. 【概要・ゴール】(どのような完成形を目指すべきか)
2. 【全体構成案】(序論・本論・結論 または ステップ1〜3)
3. 【最初にやるべき3つのアクション】
4. 【執筆・作成のヒント・注意点】
`;

            const res = await askGemini(prompt);
            prototypeOutput.innerText = res;
        });
    </script>
</body>
</html>
