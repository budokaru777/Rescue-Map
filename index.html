<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習・作業ポータル & Google カレンダー</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #e1e5eb;
            --primary-color: #4a6cf7;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            box-shadow: var(--shadow);
        }

        .btn-icon:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* ショートカットカード */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.2rem;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .card.classroom .card-icon { color: #0f9d58; }
        .card.calendar-card .card-icon { color: #4285f4; }
        .card.teams .card-icon { color: #6264a7; }
        .card.moodle .card-icon { color: #f7931e; }

        /* 設定パネル */
        .settings-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: none;
            box-shadow: var(--shadow);
        }

        .settings-panel.active { display: block; }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 1rem;
        }

        .setting-item label {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .setting-item input {
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        /* カレンダーセクション */
        .calendar-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .calendar-container {
            width: 100%;
            height: 550px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .calendar-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* AI セクション */
        .ai-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .ai-layout { grid-template-columns: 1fr; }
        }

        .ai-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            height: 480px;
        }

        .ai-card h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* チャットエリア */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            background: var(--bg-color);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary-color);
            color: white;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .chat-input-box {
            display: flex;
            gap: 8px;
        }

        .chat-input-box input {
            flex: 1;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .btn-action {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action:hover { opacity: 0.9; }

        /* プロトタイプ作成エリア */
        .prototype-output {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 1rem;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-graduation-cap"></i> Portal & AI Workspace</h1>
        <div class="header-controls">
            <button class="btn-icon" id="toggle-settings"><i class="fa-solid fa-gear"></i> 設定</button>
            <button class="btn-icon" id="toggle-theme"><i class="fa-solid fa-moon"></i></button>
        </div>
    </header>

    <div class="container">

        <!-- 設定パネル -->
        <div class="settings-panel" id="settings-panel">
            <h2><i class="fa-solid fa-sliders"></i> ポータル基本設定</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
                設定内容はブラウザ内に安全に保存されます（GitHubの警告は発生しません）。
            </p>
            <form id="settings-form">
                <div class="setting-item">
                    <label for="calendar-id">Google カレンダー ID (メールアドレス)</label>
                    <input type="email" id="calendar-id" placeholder="rf24059q@st.omu.ac.jp">
                </div>
                <div class="setting-item">
                    <label for="gemini-api-key">Gemini API Key</label>
                    <input type="password" id="gemini-api-key" placeholder="AI Studioで発行したAPIキーを貼り付け">
                </div>
                <button type="submit" class="btn-action"><i class="fa-solid fa-floppy-disk"></i> 設定を保存</button>
            </form>
        </div>

        <!-- 1. ショートカットリンク -->
        <div class="grid">
            <a href="https://classroom.google.com" target="_blank" class="card classroom">
                <i class="fa-solid fa-chalkboard-user card-icon"></i>
                <div class="card-title">Classroom</div>
            </a>
            <a href="https://calendar.google.com" target="_blank" class="card calendar-card">
                <i class="fa-solid fa-calendar-days card-icon"></i>
                <div class="card-title">カレンダー</div>
            </a>
            <a href="https://teams.microsoft.com" target="_blank" class="card teams">
                <i class="fa-solid fa-users card-icon"></i>
                <div class="card-title">Teams</div>
            </a>
            <a href="https://moodle.org" target="_blank" class="card moodle">
                <i class="fa-solid fa-graduation-cap card-icon"></i>
                <div class="card-title">Moodle</div>
            </a>
        </div>

        <!-- 2. 統合 Google カレンダー表示 -->
        <div class="calendar-section">
            <div class="calendar-header">
                <h2><i class="fa-solid fa-calendar-check" style="color: #4285f4;"></i> 統合課題カレンダー</h2>
                <span id="cal-status-text" style="font-size: 0.85rem; color: var(--text-muted);"></span>
            </div>
            <div class="calendar-container">
                <iframe id="calendar-iframe" src="about:blank"></iframe>
            </div>
        </div>

        <!-- 3. AI ワークスペース -->
        <div class="ai-layout">
            <!-- 質問チャット -->
            <div class="ai-card">
                <h2><i class="fa-solid fa-robot" style="color: var(--primary-color);"></i> 学習相談 AI チャット</h2>
                <div class="chat-messages" id="chat-messages">
                    <div class="message ai">こんにちは！課題の質問や勉強の相談など、何でも聞いてください。</div>
                </div>
                <div class="chat-input-box">
                    <input type="text" id="chat-input" placeholder="質問を入力... (例: レポートの構成のコツは？)">
                    <button class="btn-action" id="send-chat-btn"><i class="fa-solid fa-paper-plane"></i> 送信</button>
                </div>
            </div>

            <!-- プロトタイプ生成器 -->
            <div class="ai-card">
                <h2><i class="fa-solid fa-wand-magic-sparkles" style="color: #f7931e;"></i> 課題プロトタイプ生成</h2>
                <div class="prototype-output" id="prototype-output">
                    下の入力欄に課題のタイトルやテーマを入力してボタンを押すと、AIが構成案（プロトタイプ）を作成します。
                </div>
                <div class="chat-input-box" style="flex-direction: column; gap: 8px;">
                    <input type="text" id="task-input" placeholder="課題名・テーマを入力 (例: 物理学演習第3回レポート)">
                    <button class="btn-action" id="gen-prototype-btn" style="width: 100%; justify-content: center;">
                        <i class="fa-solid fa-bolt"></i> プロトタイプ（骨子）を即座に自動生成
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // DOM要素
        const settingsBtn = document.getElementById('toggle-settings');
        const settingsPanel = document.getElementById('settings-panel');
        const settingsForm = document.getElementById('settings-form');
        const calIdInput = document.getElementById('calendar-id');
        const apiKeyInput = document.getElementById('gemini-api-key');
        const calIframe = document.getElementById('calendar-iframe');
        const calStatusText = document.getElementById('cal-status-text');
        const themeBtn = document.getElementById('toggle-theme');

        // ローカルストレージから設定を取得（デフォルトは st.omu.ac.jp アカウント）
        let userCalId = localStorage.getItem('portal_cal_id') || 'rf24059q@st.omu.ac.jp';
        let geminiApiKey = localStorage.getItem('portal_gemini_key') || '';

        // 初期表示の設定
        calIdInput.value = userCalId;
        apiKeyInput.value = geminiApiKey;

        // カレンダー埋め込みの更新
        function updateCalendarIframe(email) {
            if (!email) {
                calStatusText.innerText = '※右上の設定からカレンダーIDを入力してください';
                return;
            }
            const encodedEmail = encodeURIComponent(email);
            const calUrl = `https://calendar.google.com/calendar/embed?src=${encodedEmail}&ctz=Asia%2FTokyo`;
            calIframe.src = calUrl;
            calStatusText.innerText = `表示中: ${email}`;
        }

        updateCalendarIframe(userCalId);

        // テーマ切り替え
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            themeBtn.innerHTML = newTheme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        });

        // 設定パネル開閉
        settingsBtn.addEventListener('click', () => settingsPanel.classList.toggle('active'));

        // 設定保存
        settingsForm.addEventListener('submit', (e) => {
            e.preventDefault();
            userCalId = calIdInput.value.trim();
            geminiApiKey = apiKeyInput.value.trim();

            localStorage.setItem('portal_cal_id', userCalId);
            localStorage.setItem('portal_gemini_key', geminiApiKey);

            updateCalendarIframe(userCalId);
            alert('設定を保存しました！');
            settingsPanel.classList.remove('active');
        });

        // Gemini API 呼び出し関数
        async function askGemini(prompt) {
            if (!geminiApiKey) {
                alert('右上の「⚙ 設定」をクリックして Gemini API Key を保存してください。');
                return null;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (data.error) {
                    return `APIエラー: ${data.error.message}`;
                }

                return data.candidates[0].content.parts[0].text;
            } catch (err) {
                console.error(err);
                return '通信エラーが発生しました。APIキーまたはネットワーク状態を確認してください。';
            }
        }

        // 1. AIチャット機能
        const chatInput = document.getElementById('chat-input');
        const sendChatBtn = document.getElementById('send-chat-btn');
        const chatMessages = document.getElementById('chat-messages');

        async function handleChat() {
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            chatInput.value = '';

            const loadingMsg = appendMessage('思考中...', 'ai');
            const reply = await askGemini(`大学の学習アシスタントとして以下の質問に分かりやすく答えてください:\n${text}`);
            if (reply) loadingMsg.innerText = reply;
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgDiv;
        }

        sendChatBtn.addEventListener('click', handleChat);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChat(); });

        // 2. プロトタイプ自動生成機能
        const taskInput = document.getElementById('task-input');
        const genPrototypeBtn = document.getElementById('gen-prototype-btn');
        const prototypeOutput = document.getElementById('prototype-output');

        genPrototypeBtn.addEventListener('click', async () => {
            const taskName = taskInput.value.trim();
            if (!taskName) {
                alert('課題名またはテーマを入力してください！');
                return;
            }

            prototypeOutput.innerText = 'AIが課題の骨子・構成案（プロトタイプ）を作成中...';

            const prompt = `
あなたは大学の提出物・課題作成をサポートするプロのTA（ティーチングアシスタント）です。
以下の課題・テーマについて、学生が迷わず着手できるように「構成案・アプローチ・ドラフトの骨子（プロトタイプ）」を作成してください。

■ 課題テーマ/タイトル:
${taskName}

■ 出力フォーマット:
1. 【概要・ゴール】(どのような完成形を目指すべきか)
2. 【全体構成案】(序論・本論・結論 または ステップ1〜3)
3. 【最初にやるべき3つのアクション】
4. 【執筆・作成のヒント・注意点】
`;

            const res = await askGemini(prompt);
            if (res) prototypeOutput.innerText = res;
        });
    </script>
</body>
</html>
